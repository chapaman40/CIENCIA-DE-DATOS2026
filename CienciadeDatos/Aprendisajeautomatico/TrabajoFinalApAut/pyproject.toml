[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "segmentacion"
version = "0.0.1"
description = "Segmentacion de clientes RFM + clustering para e-commerce de ferreteria (TDF)"
authors = [
  { name = "Ian Gallego" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = ">=3.10"


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 99
src = ["segmentacion"]
include = ["pyproject.toml", "segmentacion/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["segmentacion"]
force-sort-within-sections = true

